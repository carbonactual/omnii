name: Bootstrap Lockfiles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.created == true || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate web lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Publish lockfile branch
        shell: bash
        run: |
          set -euo pipefail
          branch="ci/generated-lock-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add package-lock.json apps/web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): generate deterministic lockfiles"
          git push --set-upstream origin "${branch}"
