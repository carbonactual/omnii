name: Control Plane Conformance

on:
  push:
    branches: [main]
    paths:
      - 'data/canonical/omnii-control-plane-registry.json'
      - 'docs/architecture/OMNII_CONTROL_PLANE_CANONICAL.md'
      - 'docs/architecture/OMNII_CONTRADICTION_RESOLUTION_DOCTRINE.md'
      - 'scripts/validate-control-plane.mjs'
      - '.github/workflows/control-plane-conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/canonical/omnii-control-plane-registry.json'
      - 'docs/architecture/OMNII_CONTROL_PLANE_CANONICAL.md'
      - 'docs/architecture/OMNII_CONTRADICTION_RESOLUTION_DOCTRINE.md'
      - 'scripts/validate-control-plane.mjs'
      - '.github/workflows/control-plane-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2

      - name: Validate control registry
        run: node scripts/validate-control-plane.mjs
