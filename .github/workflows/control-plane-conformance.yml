name: Control Plane Conformance

on:
  push:
    branches: [main]
    paths:
      - 'data/canonical/omnii-control-plane-registry.json'
      - 'docs/architecture/OMNII_CONTROL_PLANE_CANONICAL.md'
      - 'docs/architecture/OMNII_CONTRADICTION_RESOLUTION_DOCTRINE.md'
      - 'docs/architecture/OMNII_SECURITY_POSTURE_AND_PROVIDER_BOUNDARIES.md'
      - 'docs/architecture/OMNII_INSTITUTIONAL_COMPOSITION_INDEX.md'
      - 'docs/architecture/OMNII_OMNI_DESK_REPOSITORY_RECONCILIATION.md'
      - 'docs/architecture/OMNII_INTERNET_RECYCLE_BIN.md'
      - 'docs/architecture/OMNII_INTERNET_RIGHTS_CONSENT_RELATIONSHIP_LIFECYCLE.md'
      - 'docs/architecture/OMNII_INTERNET_INTERACTION_REQUEST_LIFECYCLE.md'
      - 'docs/ecosystem-manifests/**'
      - 'config/ecosystem-capabilities/**'
      - 'config/ecosystem-product-manifest.schema.json'
      - 'config/ecosystem-capability-manifest.schema.json'
      - 'schemas/omnii-digital-disposition.schema.json'
      - 'schemas/omnii-rights-consent.schema.json'
      - 'schemas/omnii-interaction-request.schema.json'
      - 'scripts/validate-control-plane.mjs'
      - 'scripts/validate-security-posture.mjs'
      - 'scripts/validate-digital-disposition.mjs'
      - 'scripts/validate-rights-consent.mjs'
      - 'scripts/validate-interaction-request.mjs'
      - 'scripts/ecosystem-composition-conformance.mjs'
      - 'scripts/ecosystem-composition-conformance.test.mjs'
      - '.github/workflows/control-plane-conformance.yml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'data/canonical/omnii-control-plane-registry.json'
      - 'docs/architecture/OMNII_CONTROL_PLANE_CANONICAL.md'
      - 'docs/architecture/OMNII_CONTRADICTION_RESOLUTION_DOCTRINE.md'
      - 'docs/architecture/OMNII_SECURITY_POSTURE_AND_PROVIDER_BOUNDARIES.md'
      - 'docs/architecture/OMNII_INSTITUTIONAL_COMPOSITION_INDEX.md'
      - 'docs/architecture/OMNII_OMNI_DESK_REPOSITORY_RECONCILIATION.md'
      - 'docs/architecture/OMNII_INTERNET_RECYCLE_BIN.md'
      - 'docs/architecture/OMNII_INTERNET_RIGHTS_CONSENT_RELATIONSHIP_LIFECYCLE.md'
      - 'docs/architecture/OMNII_INTERNET_INTERACTION_REQUEST_LIFECYCLE.md'
      - 'docs/ecosystem-manifests/**'
      - 'config/ecosystem-capabilities/**'
      - 'config/ecosystem-product-manifest.schema.json'
      - 'config/ecosystem-capability-manifest.schema.json'
      - 'schemas/omnii-digital-disposition.schema.json'
      - 'schemas/omnii-rights-consent.schema.json'
      - 'schemas/omnii-interaction-request.schema.json'
      - 'scripts/validate-control-plane.mjs'
      - 'scripts/validate-security-posture.mjs'
      - 'scripts/validate-digital-disposition.mjs'
      - 'scripts/validate-rights-consent.mjs'
      - 'scripts/validate-interaction-request.mjs'
      - 'scripts/ecosystem-composition-conformance.mjs'
      - 'scripts/ecosystem-composition-conformance.test.mjs'
      - '.github/workflows/control-plane-conformance.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2

      - name: Validate control registry
        run: node scripts/validate-control-plane.mjs

      - name: Validate security posture
        run: node scripts/validate-security-posture.mjs

      - name: Validate digital disposition
        run: node scripts/validate-digital-disposition.mjs

      - name: Validate internet rights and consent
        run: node scripts/validate-rights-consent.mjs

      - name: Validate internet interaction requests
        run: node scripts/validate-interaction-request.mjs

      - name: Validate ecosystem composition
        run: npm run ecosystem:conformance
