name: Bootstrap Lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Generate canonical root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit canonical root lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bootstrap-lockfile-artifact.yml
          git add package-lock.json .github/workflows/bootstrap-lockfile-artifact.yml
          if git diff --cached --quiet; then
            echo "Canonical lockfile already committed; nothing to do."
            exit 0
          fi
          git commit -m "chore(ci): commit canonical npm lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}
