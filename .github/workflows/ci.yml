name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify repository SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CI_EXPECTED_SHA=${GITHUB_SHA}"
          echo "CI_ACTUAL_SHA=${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Verify deterministic dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test "$(node -p "require('./package-lock.json').lockfileVersion")" = "3"
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify universal movement contract
        run: |
          test -s UNIVERSAL_MOVEMENT.md
          grep -q "Universal Movement is the permanent abstraction" UNIVERSAL_MOVEMENT.md
          grep -q "Charter is an orchestration product over Universal Movement" UNIVERSAL_MOVEMENT.md
          grep -q "space stations, lunar and Mars mobility" UNIVERSAL_MOVEMENT.md

      - name: Typecheck repository
        run: npm run typecheck

      - name: Runtime tests
        run: npm run test:runtime

      - name: Runtime package typecheck/build
        run: npx tsc -p packages/omnii-runtime/tsconfig.json

      - name: Production build
        run: npm run build

      - name: Publish SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'CI_VERIFIED_SHA=%s\n' "${GITHUB_SHA}"
            printf 'CI_VERIFIED_REF=%s\n' "${GITHUB_REF}"
            printf 'CI_EVENT=%s\n' "${GITHUB_EVENT_NAME}"
            printf 'CI_NODE=%s\n' "$(node --version)"
            printf 'CI_NPM=%s\n' "$(npm --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

# Certification boundary: a SHA is certified only after every verification step above succeeds.
