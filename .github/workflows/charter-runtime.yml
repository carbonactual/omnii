name: CHARTER Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/omnii-runtime/src/charter-journey-*.ts'
      - 'packages/omnii-runtime/tests/charter-journey-*.test.ts'
      - 'packages/omnii-runtime/src/event-engine.ts'
      - 'packages/omnii-runtime/src/object-runtime.ts'
      - 'packages/omnii-runtime/src/persistence.ts'
      - '.github/workflows/charter-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/omnii-runtime/src/charter-journey-*.ts'
      - 'packages/omnii-runtime/tests/charter-journey-*.test.ts'
      - 'packages/omnii-runtime/src/event-engine.ts'
      - 'packages/omnii-runtime/src/object-runtime.ts'
      - 'packages/omnii-runtime/src/persistence.ts'
      - '.github/workflows/charter-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-charter-runtime:
    name: Verify CHARTER runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck canonical journey runtime
        run: >-
          npx tsc --ignoreConfig --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --types node --lib ES2022,DOM
          packages/omnii-runtime/src/types.ts
          packages/omnii-runtime/src/persistence.ts
          packages/omnii-runtime/src/object-runtime.ts
          packages/omnii-runtime/src/relationship-runtime.ts
          packages/omnii-runtime/src/event-engine.ts
          packages/omnii-runtime/src/charter-journey-events.ts
          packages/omnii-runtime/src/charter-journey-execution-runtime.ts
          packages/omnii-runtime/src/charter-journey-handoff-runtime.ts
          packages/omnii-runtime/src/charter-journey-evidence.ts
          packages/omnii-runtime/src/charter-journey-recovery-runtime.ts
      - name: Canonical lifecycle and modules tests
        run: node --import tsx --test packages/omnii-runtime/tests/charter-journey-canonical-lifecycle.test.ts packages/omnii-runtime/tests/charter-journey-modules.test.ts
