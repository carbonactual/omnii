name: OMNII Runtime Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/omnii-runtime/**'
      - '.github/workflows/runtime-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-package:
    name: Verify @omnii/runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Runtime package build
        run: npx tsc -p packages/omnii-runtime/tsconfig.json

      - name: Process progression behavior test
        run: node --import tsx --test packages/omnii-runtime/tests/process-progression-runtime.test.ts
