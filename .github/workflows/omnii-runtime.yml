name: OMNII Runtime Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck repository
        run: pnpm typecheck

      - name: Constitutional runtime tests
        run: pnpm test:runtime

      - name: Constitutional runtime typecheck/build
        run: pnpm exec tsc -p packages/omnii-runtime/tsconfig.json

# Constitutional CI evidence trigger: push execution must be observable before certification.
