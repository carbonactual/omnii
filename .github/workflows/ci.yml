name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CI_EXPECTED_SHA=${GITHUB_SHA}"
          echo "CI_ACTUAL_SHA=${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime tests
        run: npm run test:runtime

      - name: Production build
        run: npm run build

      - name: Publish SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_VERIFIED_SHA=%s\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'CI_VERIFIED_REF=%s\n' "${GITHUB_REF}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'CI_EVENT=%s\n' "${GITHUB_EVENT_NAME}" >> "${GITHUB_STEP_SUMMARY}"
